# Every provider checks the shared repositories below, with the same bucket names and paths.
[providers.primary]
type = "s3"
endpoint = "https://s3.example.com"
region = "us-east-1"
access_key_id_env = "AWS_ACCESS_KEY_ID"
secret_access_key_env = "AWS_SECRET_ACCESS_KEY"
# Optional: name of an environment variable containing a temporary session token.
# session_token_env = "AWS_SESSION_TOKEN"

[providers.mirror]
type = "s3"
endpoint = "https://mirror.example.com"
region = "us-east-1"
access_key_id_env = "MIRROR_ACCESS_KEY_ID"
secret_access_key_env = "MIRROR_SECRET_ACCESS_KEY"

[checks.age]
max_age_days = 7

[[repositories]]
uri = "s3://bucket-one/backups/server-a"
# Optional: fail when this repository exceeds the given total size.
# The value is a whole number with a binary unit: B, KiB, MiB, GiB, TiB, or PiB.
# max_size = "100GiB"
# Optional: disable these checks for this repository in check and report.
# Valid names: "folders", "age", "content", "size". Omit or use [] to keep all checks.
silence_checks = []

[[repositories]]
uri = "s3://bucket-one/backups/server-b"

[[repositories]]
uri = "s3://bucket-two/database"

# Optional: validate matching files' first 64 bytes, recursively.
# The first matching rule wins; files without a matching rule are accepted.
# Uncomment only if these patterns describe the actual repository format.
# [[repositories.content_check.rules]]
# glob = "**/*.gz"
# pattern = '^\x1f\x8b\x08'
#
# [[repositories.content_check.rules]]
# glob = "**/*.custom"
# pattern = '^BACKUP v[12]\x00'

# Required only for the report subcommand.
[email]
smtp_host = "smtp.example.com"
smtp_port = 587
encryption = "starttls" # "starttls" (default, port 587) or "tls" (port 465)
from = "backups@example.com"
to = ["ops@example.com"]
subject = "Backup repository alerts"
