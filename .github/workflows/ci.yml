# Build and test with the minimum supported toolchain, then check formatting and lints.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust 1.94.0
        run: |
          rustup toolchain install 1.94.0 --profile minimal
          rustup default 1.94.0

      - name: Cache Cargo registry, git sources, and build output
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-1.94.0-build-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-1.94.0-build-

      - name: Build
        run: cargo build --locked

      - name: Test
        run: cargo test --locked

  format-and-lint:
    name: Format and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust 1.94.0 with rustfmt and clippy
        run: |
          rustup toolchain install 1.94.0 --profile minimal --component rustfmt,clippy
          rustup default 1.94.0

      - name: Cache Cargo registry, git sources, and build output
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-1.94.0-lint-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-1.94.0-lint-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
