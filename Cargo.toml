[package]
name = "backup-repos-checker"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"

[dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["now"] }
clap = { version = "4", default-features = false, features = ["derive", "std", "color", "help", "usage", "error-context"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
globset = "0.4"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls", "ring", "webpki-roots"] }
regex = "1"
rust-s3 = { version = "0.38", default-features = false, features = ["tokio-rustls-tls-ring"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util"] }
toml = { version = "0.9", default-features = false, features = ["std", "serde", "parse"] }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["net", "io-util", "time"] }
